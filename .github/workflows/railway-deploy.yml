name: Railway Deployment Pipeline (Root Monorepo)

on:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Service to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend
      environment:
        description: 'Target Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dev
          - production

concurrency:
  group: railway-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # STAGE 1: PREFLIGHT & ENVIRONMENT CONFIGURATION
  # -------------------------------------------------------------
  stage-1-preflight:
    name: "🔍 1. Chuẩn bị Môi trường & Token"
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.setup.outputs.env_name }}
      be_url: ${{ steps.setup.outputs.be_url }}
      fe_url: ${{ steps.setup.outputs.fe_url }}
    steps:
      - name: Setup Environment Variables
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            ENV_NAME="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="dev"
          fi

          if [ "$ENV_NAME" = "production" ]; then
            BE_URL="https://backend-tms-core-production.up.railway.app/api/v1/health"
            FE_URL="https://frontend-tms-core-production.up.railway.app"
          else
            BE_URL="https://backend-tms-core-dev.up.railway.app/api/v1/health"
            FE_URL="https://frontend-tms-core-dev.up.railway.app"
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "be_url=$BE_URL" >> $GITHUB_OUTPUT
          echo "fe_url=$FE_URL" >> $GITHUB_OUTPUT
          echo "🎯 Target Environment: $ENV_NAME"

  # -------------------------------------------------------------
  # STAGE 2: BACKEND PIPELINE (DEPLOY & HEALTH)
  # -------------------------------------------------------------
  stage-2-backend-deploy:
    name: "🚀 2. Triển khai Backend"
    needs: stage-1-preflight
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'backend') || (github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend Container
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ needs.stage-1-preflight.outputs.env_name == 'production' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_DEV_TOKEN }}
        run: |
          echo "🚀 Triển khai backend-tms-core lên ${{ needs.stage-1-preflight.outputs.env_name }}..."
          railway up --service backend-tms-core --environment "${{ needs.stage-1-preflight.outputs.env_name }}"

      - name: Verify Backend Live Health
        run: |
          TARGET_URL="${{ needs.stage-1-preflight.outputs.be_url }}"
          echo "🔍 Kiểm tra phản hồi trực tiếp từ $TARGET_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$TARGET_URL" || true)
            echo "Lần thử $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend đã LIVE và phản hồi HTTP 200 OK!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Quá thời gian chờ phản hồi từ health endpoint ($TARGET_URL)"
          exit 1

  # -------------------------------------------------------------
  # STAGE 3: FRONTEND PIPELINE (DEPLOY & HEALTH)
  # -------------------------------------------------------------
  stage-3-frontend-deploy:
    name: "🎨 3. Triển khai Frontend"
    needs: stage-1-preflight
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'frontend') || (github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend Container
        working-directory: frontend
        env:
          RAILWAY_TOKEN: ${{ needs.stage-1-preflight.outputs.env_name == 'production' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_DEV_TOKEN }}
        run: |
          echo "🚀 Triển khai frontend-tms-core lên ${{ needs.stage-1-preflight.outputs.env_name }}..."
          railway up --service frontend-tms-core --environment "${{ needs.stage-1-preflight.outputs.env_name }}"

      - name: Verify Frontend Live Health
        run: |
          TARGET_URL="${{ needs.stage-1-preflight.outputs.fe_url }}"
          echo "🔍 Kiểm tra phản hồi trực tiếp từ $TARGET_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$TARGET_URL" || true)
            echo "Lần thử $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Frontend đã LIVE và phản hồi HTTP $STATUS thành công!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Quá thời gian chờ phản hồi từ domain ($TARGET_URL)"
          exit 1

  # -------------------------------------------------------------
  # STAGE 4: AUDIT SUMMARY & REPORT
  # -------------------------------------------------------------
  stage-4-summary:
    name: "📋 4. Tổng kết Pipeline"
    needs: [stage-1-preflight, stage-2-backend-deploy, stage-3-frontend-deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary Report
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Báo Cáo Triển Khai TMS Core (Monorepo)
          | Hạng mục | Chi tiết |
          |---|---|
          | **Môi trường** | \`${{ needs.stage-1-preflight.outputs.env_name }}\` |
          | **Backend API** | [${{ needs.stage-1-preflight.outputs.be_url }}](${{ needs.stage-1-preflight.outputs.be_url }}) |
          | **Frontend Web** | [${{ needs.stage-1-preflight.outputs.fe_url }}](${{ needs.stage-1-preflight.outputs.fe_url }}) |
          | **Commit SHA** | \`${{ github.sha }}\` |
          | **Nhánh Git** | \`${{ github.ref_name }}\` |
          | **Runtime** | Node.js 22 LTS |
          EOF
