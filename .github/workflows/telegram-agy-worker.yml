name: Antigravity Telegram Task Worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Yêu cầu task từ Telegram'
        required: true
        type: string
      task_id:
        description: 'Task ID'
        required: false
        default: 'manual'
        type: string
      sender_name:
        description: 'Tên người gửi (Telegram Username)'
        required: false
        default: 'User'
        type: string
      mode:
        description: 'Chế độ thực thi'
        required: false
        default: 'leader'
        type: choice
        options:
          - leader
          - todo
          - sync

  repository_dispatch:
    types: [telegram-task]

concurrency:
  group: agy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # GIAI ĐOẠN 1: TIẾP NHẬN TASK & ĐÁNH DẤU TRẠNG THÁI IN_PROGRESS VÀO DB
  # =========================================================================
  intake-task:
    name: "📥 1. Tiếp nhận Task & Đánh dấu DB"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      task_id: ${{ steps.claim.outputs.task_id }}
      prompt: ${{ steps.claim.outputs.prompt }}
      sender_name: ${{ steps.claim.outputs.sender_name }}
      mode: ${{ steps.claim.outputs.mode }}
      has_task: ${{ steps.claim.outputs.has_task }}

    steps:
      - name: "Cài đặt Node.js môi trường tiếp nhận"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Cài đặt pg driver"
        run: |
          npm install --no-package-lock --no-save pg

      - name: "Đánh dấu IN_PROGRESS vào Database & Báo Telegram bắt đầu"
        id: claim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TASK_ID: ${{ github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
          SENDER: ${{ github.event.inputs.sender_name || github.event.client_payload.sender_name || 'User' }}
          RAW_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'leader' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const outputFile = process.env.GITHUB_OUTPUT;
          function setOutput(key, value) {
            if (outputFile) {
              if (String(value).includes("\n")) {
                const delimiter = "EOF_" + Math.random().toString(36).substring(2);
                fs.appendFileSync(outputFile, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
              } else {
                fs.appendFileSync(outputFile, `${key}=${value}\n`);
              }
            }
          }

          const runId = process.env.GITHUB_RUN_ID || "";
          const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
          const repo = process.env.GITHUB_REPOSITORY || "lyquangthai1993/logistics-website";
          const runUrl = runId ? `${serverUrl}/${repo}/actions/runs/${runId}` : `${serverUrl}/${repo}/actions`;

          function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }

          async function main() {
            const dbUrl = process.env.DATABASE_URL;
            let requestedId = process.env.TASK_ID;
            let sender = process.env.SENDER || "User";
            let rawPrompt = process.env.RAW_PROMPT || "";
            let mode = process.env.MODE || "leader";
            let taskId = requestedId;
            let task = null;

            if (dbUrl) {
              try {
                const { Client } = require("pg");
                const client = new Client({
                  connectionString: dbUrl,
                  ssl: dbUrl.includes("neon.tech") ? { rejectUnauthorized: false } : false
                });
                await client.connect();

                // 1. Nếu có requestedId (task_id cụ thể được chỉ định từ webhook/dispatch) -> Ưu tiên xử lý chính xác task này
                if (requestedId && requestedId !== "manual" && !isNaN(Number(requestedId))) {
                  const reqRes = await client.query(
                    "SELECT * FROM telegram_tasks WHERE task_id = $1 OR (task_id IS NULL AND id = $1)",
                    [parseInt(requestedId, 10)]
                  );
                  if (reqRes.rows.length > 0) {
                    const existingTask = reqRes.rows[0];
                    const promptToCheck = (existingTask.raw_prompt || "") + " " + (rawPrompt || "");
                    const isExplicitForce = promptToCheck.includes("/force") || promptToCheck.includes("/retry");

                    if (existingTask.status === "PENDING" || isExplicitForce) {
                      await client.query("UPDATE telegram_tasks SET status = $1, started_at = NOW() WHERE id = $2", ["IN_PROGRESS", existingTask.id]);
                      task = existingTask;
                      console.log(`🎯 [Direct Task] Đã claim Task #${task.task_id || task.id} sang IN_PROGRESS.`);
                    } else if (["IN_PROGRESS", "COMPLETED", "TODO_CREATED"].includes(existingTask.status)) {
                      console.log(`⏭️ [Deduplication] Task #${existingTask.task_id || existingTask.id} đã ở trạng thái "${existingTask.status}". Bỏ qua lượt kích hoạt trùng lặp.`);
                      task = null;
                      taskId = "manual";
                      rawPrompt = "";
                    } else {
                      await client.query("UPDATE telegram_tasks SET status = $1, started_at = NOW() WHERE id = $2", ["IN_PROGRESS", existingTask.id]);
                      task = existingTask;
                      console.log(`🎯 [Direct Task] Đã kích hoạt Task #${task.task_id || task.id} sang IN_PROGRESS.`);
                    }
                  }
                }

                // 2. Nếu chưa có task và không chỉ định requestedId -> Quét tìm task PENDING cũ nhất (FIFO Queue Claiming)
                if (!task) {
                  const pendingRes = await client.query(
                    "SELECT * FROM telegram_tasks WHERE status = $1 AND task_id IS NOT NULL ORDER BY id ASC LIMIT 1",
                    ["PENDING"]
                  );

                  if (pendingRes.rows.length > 0) {
                    const targetId = pendingRes.rows[0].id;
                    const updateRes = await client.query(
                      "UPDATE telegram_tasks SET status = $1, started_at = NOW() WHERE id = $2 RETURNING *",
                      ["IN_PROGRESS", targetId]
                    );
                    task = updateRes.rows[0];
                    console.log(`🎯 [FIFO Queue] Đã claim Task #${task.task_id || task.id} (Tạo lúc: ${task.created_at}) sang IN_PROGRESS.`);
                  }
                }

                await client.end();
              } catch (err) {
                console.warn("⚠️ Lỗi truy vấn Database khi claim task:", err.message);
              }
            }

            if (task) {
              taskId = String(task.task_id != null ? task.task_id : task.id);
              sender = task.sender_name || sender;
              rawPrompt = (task.analysis || task.raw_prompt || rawPrompt).replace(/<id>/g, taskId);
              if (task.raw_prompt && (task.raw_prompt.includes("/force") || task.raw_prompt.includes("todo-agent") || task.raw_prompt.includes("/todo"))) {
                mode = "todo";
              }
            } else {
              taskId = "manual";
              rawPrompt = "";
            }

            setOutput("task_id", taskId);
            setOutput("prompt", rawPrompt);
            setOutput("sender_name", sender);
            setOutput("mode", mode);
            setOutput("has_task", (task && taskId && taskId !== "manual") ? "true" : "false");

            // Tác vụ được nhận diện và claim thành công trong im lặng (Zero spam khi bắt đầu)
            console.log(`✅ [Intake] Task #${taskId} sẵn sàng chuyển sang Job 2 thực thi.`);
          }

          main().catch(err => {
            console.error("Lỗi nghiêm trọng tại intake-task:", err);
            setOutput("has_task", "false");
          });
          '

  # =========================================================================
  # GIAI ĐOẠN 2: THỰC THI AI, KIỂM ĐỊNH MÃ NGUỒN & COMMIT/PUSH LÊN DEV
  # =========================================================================
  execute-task:
    name: "🤖 2. Thực thi AI & Kiểm định Mã Nguồn"
    needs: [intake-task]
    if: needs.intake-task.outputs.has_task != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "1. Checkout Repositories & Submodules"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: dev
          submodules: recursive
          fetch-depth: 0

      - name: "2. Cấu hình Danh tính Git & Đồng bộ Nhánh dev cho Submodules"
        run: |
          git config --global user.name "Antigravity AI Worker"
          git config --global user.email "antigravity-bot@users.noreply.github.com"

          echo "🔄 Đang cất tạm thay đổi (stash) và chuyển tất cả sang nhánh dev..."
          git stash push -u -m "worker-init-stash" 2>/dev/null || true
          git checkout dev 2>/dev/null || git checkout -B dev origin/dev
          git pull --rebase origin dev || true
          git stash pop 2>/dev/null || true

          if [ -d "backend" ]; then
            cd backend
            git stash push -u -m "worker-init-stash" 2>/dev/null || true
            git checkout dev 2>/dev/null || git checkout -B dev origin/dev
            git pull --rebase origin dev || true
            git stash pop 2>/dev/null || true
            cd ..
          fi
          if [ -d "frontend" ]; then
            cd frontend
            git stash push -u -m "worker-init-stash" 2>/dev/null || true
            git checkout dev 2>/dev/null || git checkout -B dev origin/dev
            git pull --rebase origin dev || true
            git stash pop 2>/dev/null || true
            cd ..
          fi

      - name: "3. Cài đặt Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "3.1. Khôi phục Cache Dependencies (Root, Backend, Frontend)"
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            ~/.npm
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: "4. Cài đặt Project Dependencies"
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          echo "📦 Cache miss: Đang cài đặt dependencies cho các dự án..."
          npm install --prefer-offline --no-audit || npm install
          if [ -d "backend" ]; then (cd backend && npm install --prefer-offline --no-audit || npm install); fi
          if [ -d "frontend" ]; then (cd frontend && npm install --prefer-offline --no-audit || npm install); fi

      - name: "4.1. Khôi phục Cache Antigravity CLI (agy)"
        id: agy-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/agy
            ~/.local/share/antigravity
            ~/bin/agy
          key: agy-cli-${{ runner.os }}

      - name: "5. Cài đặt Antigravity CLI (agy)"
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          if command -v agy >/dev/null 2>&1; then
            echo "⚡ Khôi phục Antigravity CLI từ Cache thành công: $(agy --version 2>/dev/null || echo 'ready')"
          else
            echo "⬇️ Đang cài đặt Antigravity CLI mới từ Google..."
            curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          fi


      - name: "6. Khởi chạy Antigravity CLI (Headless Mode)"
        env:
          AGY_SESSION_TOKEN: ${{ secrets.AGY_SESSION_TOKEN }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          RAW_PROMPT: ${{ needs.intake-task.outputs.prompt || github.event.inputs.prompt || github.event.client_payload.prompt }}
          MODE: ${{ needs.intake-task.outputs.mode || github.event.inputs.mode || github.event.client_payload.mode || 'leader' }}
          TASK_ID: ${{ needs.intake-task.outputs.task_id || github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
        run: |
          if [ -z "$AGY_SESSION_TOKEN" ] && [ -z "$ANTIGRAVITY_API_KEY" ]; then
            echo "❌ Lỗi: Thiếu secret AGY_SESSION_TOKEN trên GitHub Repository Secrets!"
            exit 1
          fi

          if [ -n "$AGY_SESSION_TOKEN" ]; then
            echo "🔐 Đang cấu hình Linux Secret Service & D-Bus session..."
            sudo apt-get update -qq && sudo apt-get install -y -qq dbus dbus-x11 gnome-keyring libsecret-tools python3-secretstorage

            mkdir -p ~/.local/share/keyrings
            eval $(dbus-launch --sh-syntax)
            export DBUS_SESSION_BUS_ADDRESS

            eval "$(printf '\n' | gnome-keyring-daemon --replace --unlock --components=secrets 2>/dev/null || true)"
            export GNOME_KEYRING_CONTROL

            python3 -c "import secretstorage; conn = secretstorage.dbus_init(); col = secretstorage.get_default_collection(conn) if list(secretstorage.get_all_collections(conn)) else secretstorage.create_collection(conn, 'login', alias='default'); col.unlock() if col.is_locked() else None; print('Keyring ready')" 2>/dev/null || true

            printf "%s" "$AGY_SESSION_TOKEN" | secret-tool store --label="gemini" service gemini username antigravity

            LOOKUP_RES=$(secret-tool lookup service gemini username antigravity 2>/dev/null || true)
            if [ -n "$LOOKUP_RES" ]; then
              echo "✅ Kiểm tra Keyring đối soát: Kết nối thành công (Secret Stored & Ready)"
            else
              echo "❌ Kiểm tra Keyring đối soát: Thất bại (Không tìm thấy token trong Keyring)"
              exit 1
            fi

            echo "🚀 Đang khởi chạy agy headless mode với session keyring (Live Streaming Log)..."
            agy -p "$RAW_PROMPT" \
              --dangerously-skip-permissions \
              --model "gemini-3.8-flash-high" \
              --output-format text 2>&1 | tee /tmp/agy_output.txt
            AGY_EXIT=${PIPESTATUS[0]}
          else
            echo "🚀 Đang khởi chạy agy headless mode với API key (Live Streaming Log)..."
            export ANTIGRAVITY_API_KEY="$ANTIGRAVITY_API_KEY"
            export GEMINI_API_KEY="$ANTIGRAVITY_API_KEY"
            agy -p "$RAW_PROMPT" \
              --dangerously-skip-permissions \
              --model "gemini-3.8-flash-high" \
              --output-format text 2>&1 | tee /tmp/agy_output.txt
            AGY_EXIT=${PIPESTATUS[0]}
          fi

          echo "🏁 Tiến trình agy hoàn tất với exit code: ${AGY_EXIT:-0}"
          if [ -n "$AGY_EXIT" ] && [ "$AGY_EXIT" -ne 0 ]; then
            echo "❌ AGY CLI kết thúc với mã lỗi $AGY_EXIT:" > /tmp/workflow_error.txt
            if [ -f /tmp/agy_output.txt ]; then
              tail -n 35 /tmp/agy_output.txt >> /tmp/workflow_error.txt
            fi
            exit $AGY_EXIT
          fi

      - name: "7. Tự động Commit & Push lên nhánh dev nếu có thay đổi"
        if: success()
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          TASK_ID: ${{ needs.intake-task.outputs.task_id || github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
          MODE: ${{ needs.intake-task.outputs.mode || github.event.inputs.mode || github.event.client_payload.mode || 'leader' }}
          SENDER: ${{ needs.intake-task.outputs.sender_name || 'User' }}
          RAW_PROMPT: ${{ needs.intake-task.outputs.prompt || '' }}
          NEXT_PUBLIC_API_URL: "https://backend-tms-core-dev.up.railway.app"
          API_URL: "https://backend-tms-core-dev.up.railway.app"
          CI: "true"
        run: |
          echo "🔍 Kiểm tra thay đổi mã nguồn sau khi AI thực thi..."
          HAS_ROOT=$(git status --porcelain || true)
          HAS_BE=$(git -C backend status --porcelain 2>/dev/null || true)
          HAS_FE=$(git -C frontend status --porcelain 2>/dev/null || true)

          {
            if [ -n "$HAS_ROOT" ]; then echo "=== Root ==="; git diff --stat; git status -s; fi
            if [ -n "$HAS_BE" ]; then echo "=== Backend ==="; git -C backend diff --stat; git -C backend status -s; fi
            if [ -n "$HAS_FE" ]; then echo "=== Frontend ==="; git -C frontend diff --stat; git -C frontend status -s; fi
          } > git_diff_summary.txt 2>&1

          if [ -z "$HAS_ROOT" ] && [ -z "$HAS_BE" ] && [ -z "$HAS_FE" ]; then
            if [ "$MODE" = "audit" ] || [[ "$TASK_ID" == *"audit"* ]] || [[ "$SENDER" == *"Schedule Trigger"* ]] || [[ "$RAW_PROMPT" == *"/todo-agent quét"* ]]; then
              echo "ℹ️ Tác vụ quét/kiểm tra định kỳ (Không có file thay đổi do toàn bộ task đã hoàn thành). Hoàn tất tác vụ an toàn."
              exit 0
            else
              echo "❌ Lỗi kiểm định: AI Worker kết thúc nhưng không có bất kỳ file nào được tạo hoặc sửa đổi (Zero file changes). Đánh dấu thất bại để ngăn báo cáo khống." > /tmp/workflow_error.txt
              exit 1
            fi
          fi


          echo "🚀 Phát hiện thay đổi file! Tiến hành tự động commit & push theo quy chuẩn Submodule-first..."

          if [ -n "$GH_PAT_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_PAT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

          commit_with_self_healing() {
            local dir=$1
            local msg=$2
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "🔄 [Lần thử $attempt/$max_attempts] Đang commit tại $dir/ với đầy đủ hooks kiểm định quy chuẩn..."
              
              if [ "$dir" = "." ]; then
                git add -A
                if git diff --cached --quiet; then
                  echo "ℹ️ Stage tại $dir/ không có thay đổi mới nào. Bỏ qua commit."
                  return 0
                fi
                COMMIT_OUT=$(git commit -m "$msg" 2>&1)
                COMMIT_CODE=$?
              else
                git -C "$dir" add -A
                if git -C "$dir" diff --cached --quiet; then
                  echo "ℹ️ Stage tại $dir/ không có thay đổi mới nào. Bỏ qua commit."
                  return 0
                fi
                COMMIT_OUT=$(git -C "$dir" commit -m "$msg" 2>&1)
                COMMIT_CODE=$?
              fi

              if [ $COMMIT_CODE -eq 0 ]; then
                echo "✅ Commit thành công tại $dir/ ở lần thử thứ $attempt!"
                return 0
              fi

              echo "⚠️ Commit tại $dir/ thất bại (Hook/Linter báo lỗi):"
              echo "$COMMIT_OUT"

              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Đã thử tự động sửa $max_attempts lần nhưng vẫn không đạt chuẩn quy tắc mã nguồn. Chặn push để bảo vệ codebase."
                echo "❌ Lỗi commit/linter tại $dir/ sau $max_attempts lần thử:" > /tmp/workflow_error.txt
                echo "$COMMIT_OUT" | tail -n 35 >> /tmp/workflow_error.txt
                return 1
              fi

              echo "🛠️ Đang kích hoạt cơ chế tự động sửa lỗi (Self-Healing)..."
              if [ "$dir" = "frontend" ]; then
                (cd frontend && npx oxfmt --write . 2>/dev/null || true)
                (cd frontend && npx oxlint --fix 2>/dev/null || true)
                if command -v agy >/dev/null 2>&1; then
                  echo "🤖 Gọi Antigravity CLI để tự sửa mã nguồn vi phạm..."
                  agy -p "Commit tại frontend thất bại do linter/typescript: ${COMMIT_OUT}. Hãy đọc kỹ các file lỗi và sửa triệt để." \
                    --dangerously-skip-permissions \
                    --model "gemini-3.8-flash-high" \
                    --output-format text 2>&1 || true
                fi
              elif [ "$dir" = "backend" ]; then
                (cd backend && npm run format 2>/dev/null || true)
                (cd backend && npm run lint:fix 2>/dev/null || true)
                if command -v agy >/dev/null 2>&1; then
                  echo "🤖 Gọi Antigravity CLI để tự sửa mã nguồn vi phạm..."
                  agy -p "Commit tại backend thất bại: ${COMMIT_OUT}. Hãy sửa triệt để." \
                    --dangerously-skip-permissions \
                    --model "gemini-3.8-flash-high" \
                    --output-format text 2>&1 || true
                fi
              fi

              attempt=$((attempt + 1))
            done
            return 1
          }

          push_with_retry() {
            local dir=$1
            local max_retries=3
            local attempt=1

            while [ $attempt -le $max_retries ]; do
              echo "🚀 [Lần push $attempt/$max_retries] Đang đồng bộ và push tại $dir..."
              local has_stash=0
              if [ "$dir" = "." ]; then
                git rebase --abort 2>/dev/null || true
                if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                  echo "📦 Cất tạm thay đổi vào stash trước khi pull..."
                  git stash push -u -m "push-retry-stash" 2>/dev/null && has_stash=1
                fi
                git fetch origin dev || true
                if ! git pull --rebase origin dev; then
                  echo "⚠️ Rebase gặp xung đột, chuyển sang chiến lược merge tự động..."
                  git rebase --abort 2>/dev/null || true
                  git pull --no-rebase -s ort -X ours origin dev --no-edit || true
                fi
                if [ $has_stash -eq 1 ]; then
                  echo "📦 Khôi phục thay đổi từ stash..."
                  git stash pop 2>/dev/null || true
                fi
                if HUSKY=0 git push --no-verify origin dev; then
                  echo "✅ Push thành công tại root repo!"
                  return 0
                fi
              else
                git -C "$dir" rebase --abort 2>/dev/null || true
                if [ -n "$(git -C "$dir" status --porcelain 2>/dev/null)" ]; then
                  echo "📦 Cất tạm thay đổi vào stash tại $dir trước khi pull..."
                  git -C "$dir" stash push -u -m "push-retry-stash" 2>/dev/null && has_stash=1
                fi
                git -C "$dir" fetch origin dev || true
                if ! git -C "$dir" pull --rebase origin dev; then
                  echo "⚠️ Rebase tại $dir gặp xung đột, chuyển sang chiến lược merge tự động..."
                  git -C "$dir" rebase --abort 2>/dev/null || true
                  git -C "$dir" pull --no-rebase -s ort -X ours origin dev --no-edit || true
                fi
                if [ $has_stash -eq 1 ]; then
                  echo "📦 Khôi phục thay đổi từ stash tại $dir..."
                  git -C "$dir" stash pop 2>/dev/null || true
                fi
                if HUSKY=0 git -C "$dir" push --no-verify origin dev; then
                  echo "✅ Push thành công tại $dir!"
                  return 0
                fi
              fi
              echo "⚠️ Push tại $dir bị từ chối (có thể remote vừa nhận commit mới), thử rebase và push lại sau 2s..."
              sleep 2
              attempt=$((attempt + 1))
            done

            echo "❌ Push tại $dir thất bại sau $max_retries lần thử."
            echo "❌ Git push tại $dir thất bại sau $max_retries lần thử (bị remote từ chối hoặc conflict)." > /tmp/workflow_error.txt
            return 1
          }


          if [ -d "backend" ] && [ -n "$HAS_BE" ]; then
            echo "📦 Đang xử lý commit & push trong backend/..."
            git -C backend checkout dev 2>/dev/null || git -C backend switch dev 2>/dev/null || true
            if commit_with_self_healing "backend" "feat(backend): task #${TASK_ID} auto-implemented by Antigravity worker"; then
              if ! push_with_retry "backend"; then
                echo "❌ Backend push thất bại, dừng quy trình push."
                exit 1
              fi
            else
              echo "❌ Backend commit thất bại, dừng quy trình push."
              exit 1
            fi
          fi

          if [ -d "frontend" ] && [ -n "$HAS_FE" ]; then
            echo "📦 Đang xử lý commit & push trong frontend/..."
            git -C frontend checkout dev 2>/dev/null || git -C frontend switch dev 2>/dev/null || true
            if commit_with_self_healing "frontend" "feat(frontend): task #${TASK_ID} auto-implemented by Antigravity worker"; then
              if ! push_with_retry "frontend"; then
                echo "❌ Frontend push thất bại, dừng quy trình push."
                exit 1
              fi
            else
              echo "❌ Frontend commit thất bại, dừng quy trình push."
              exit 1
            fi
          fi

          echo "📦 Đang commit & push thay đổi trong root repo..."
          git checkout dev 2>/dev/null || git switch dev 2>/dev/null || true
          if commit_with_self_healing "." "chore(task): update task #${TASK_ID} artifacts and submodules"; then
            if ! push_with_retry "."; then
              echo "❌ Root repo push thất bại, dừng quy trình push."
              exit 1
            fi
          else
            echo "❌ Root repo commit thất bại, dừng quy trình push."
            exit 1
          fi

          echo "✅ Đã tự động commit & push thành công lên nhánh dev!"

      - name: "8. Xuất Dữ liệu Tổng hợp Sang Artifact"
        if: always()
        env:
          TARGET_TASK_ID: ${{ needs.intake-task.outputs.task_id || github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          let diffSummary = "Không có thay đổi file";
          if (fs.existsSync("git_diff_summary.txt")) {
            const saved = fs.readFileSync("git_diff_summary.txt", "utf8").trim();
            if (saved) diffSummary = saved;
          }

          let detailedError = "";
          if (fs.existsSync("/tmp/workflow_error.txt")) {
            detailedError = fs.readFileSync("/tmp/workflow_error.txt", "utf8").trim();
          }

          let agyRes = "Hoàn tất tác vụ";
          const outPath = fs.existsSync("/tmp/agy_output.txt") ? "/tmp/agy_output.txt" : "";
          if (outPath) {
            const raw = fs.readFileSync(outPath, "utf8").trim();
            if (raw) {
              const lines = raw.split(/\r?\n/);
              agyRes = lines.slice(-80).join("\n");
            }
          }

          let commitHash = "unknown";
          try { commitHash = execSync("git rev-parse --short HEAD", { encoding: "utf8" }).trim(); } catch (_) {}

          fs.mkdirSync("/tmp/task_summary", { recursive: true });

          // Tìm ảnh bằng chứng nghiệm thu trong thư mục feedback của task
          const taskId = process.env.TARGET_TASK_ID || "manual";
          let evidenceFileName = null;
          const feedbacksDir = "feedbacks";
          if (fs.existsSync(feedbacksDir)) {
            const folders = fs.readdirSync(feedbacksDir).filter(f => {
              if (taskId && taskId !== "manual") return f.includes(`task_${taskId}`);
              return f.startsWith("feedback_");
            });
            folders.sort().reverse();
            for (const f of folders) {
              const fPath = path.join(feedbacksDir, f);
              if (!fs.statSync(fPath).isDirectory()) continue;
              const files = fs.readdirSync(fPath);
              const verified = files.find(x => /screenshot_.*verified\.(png|jpg|webp)$/i.test(x));
              let evImg = null;
              const testEvDir = path.join(fPath, "test-evidence");
              if (fs.existsSync(testEvDir)) {
                const evList = fs.readdirSync(testEvDir).filter(x => /\.(png|jpg|webp)$/i.test(x));
                if (evList.length > 0) evImg = path.join(testEvDir, evList[evList.length - 1]);
              }
              const anyImg = files.filter(x => /screenshot_.*\.(png|jpg|webp)$/i.test(x)).pop();

              const chosen = verified ? path.join(fPath, verified) : (evImg || (anyImg ? path.join(fPath, anyImg) : null));
              if (chosen && fs.existsSync(chosen)) {
                const ext = path.extname(chosen).toLowerCase() || ".png";
                const dest = path.join("/tmp/task_summary", `evidence${ext}`);
                fs.copyFileSync(chosen, dest);
                evidenceFileName = `evidence${ext}`;
                console.log(`📸 Đã sao chép ảnh bằng chứng nghiệm thu: ${chosen} -> ${dest}`);
                break;
              }
            }
          }

          const data = {
            diffSummary,
            detailedError,
            agyRes,
            commitHash,
            evidenceFileName
          };

          fs.writeFileSync("/tmp/task_summary/summary.json", JSON.stringify(data, null, 2));
          console.log("✅ Đã ghi nhận tổng hợp kết quả sang /tmp/task_summary/summary.json");
          '

      - name: "9. Upload Task Summary Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-summary-artifact
          path: /tmp/task_summary/
          retention-days: 1

  # =========================================================================
  # GIAI ĐOẠN 3: BÁO CÁO KẾT QUẢ TELEGRAM & CHỐT TRẠNG THÁI DATABASE
  # =========================================================================
  finalize-task:
    name: "📢 3. Báo cáo Telegram & Cập nhật Neon DB"
    needs: [intake-task, execute-task]
    if: always() && needs.intake-task.outputs.has_task != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Cài đặt Node.js môi trường báo cáo"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Cài đặt pg driver"
        run: |
          npm install --no-package-lock --no-save pg

      - name: "Download Task Summary Artifact"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: task-summary-artifact
          path: /tmp/task_summary

      - name: "Báo cáo Kết quả về Telegram & Cập nhật Database"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TASK_ID: ${{ needs.intake-task.outputs.task_id || github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
          SENDER: ${{ needs.intake-task.outputs.sender_name || github.event.inputs.sender_name || github.event.client_payload.sender_name || 'User' }}
          RAW_PROMPT: ${{ needs.intake-task.outputs.prompt || github.event.inputs.prompt || github.event.client_payload.prompt || '' }}
          MODE: ${{ needs.intake-task.outputs.mode || 'leader' }}
          EXECUTE_STATUS: ${{ needs.execute-task.result }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }

          const runId = process.env.GITHUB_RUN_ID || "";
          const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
          const repo = process.env.GITHUB_REPOSITORY || "lyquangthai1993/logistics-website";
          const runUrl = runId ? `${serverUrl}/${repo}/actions/runs/${runId}` : `${serverUrl}/${repo}/actions`;
          const executeStatus = process.env.EXECUTE_STATUS || "failure";
          const taskId = process.env.TASK_ID || "manual";
          const sender = process.env.SENDER || "User";
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_ALLOWED_CHAT_ID;
          const mode = process.env.MODE || "leader";
          const isLeaderMode = mode === "leader";
          const isDone = executeStatus === "success";

          let finalTaskStatus = "FAILED";
          if (isDone) {
            finalTaskStatus = isLeaderMode ? "TODO_CREATED" : "COMPLETED";
          } else {
            finalTaskStatus = "FAILED";
          }

          let diffSummary = "Không có thay đổi file";
          let detailedError = "";
          let agyRes = "Hoàn tất tác vụ";
          let commitHash = "unknown";
          let evidenceFileName = null;

          if (fs.existsSync("/tmp/task_summary/summary.json")) {
            try {
              const parsed = JSON.parse(fs.readFileSync("/tmp/task_summary/summary.json", "utf8"));
              if (parsed.diffSummary) diffSummary = parsed.diffSummary;
              if (parsed.detailedError) detailedError = parsed.detailedError;
              if (parsed.agyRes) agyRes = parsed.agyRes;
              if (parsed.commitHash) commitHash = parsed.commitHash;
              if (parsed.evidenceFileName) evidenceFileName = parsed.evidenceFileName;
            } catch (_) {}
          }

          if (executeStatus !== "success" && !detailedError) {
            detailedError = "Tiến trình thực thi AI gặp sự cố hoặc timeout trong Giai đoạn 2. Chi tiết xem tại log GitHub Actions.";
          }

          const statusBadge = executeStatus === "success" ? "🟢 HOÀN THÀNH" : "🔴 THẤT BẠI";

          // Thuật toán chia nhỏ chuỗi bảo toàn thẻ HTML của Telegram
          const SUPPORTED_TAGS = new Set([
            "b", "strong", "i", "em", "u", "ins", "s", "strike", "del", 
            "span", "tg-spoiler", "a", "code", "pre", "blockquote"
          ]);

          function splitTelegramHtml(text, maxLen = 3800, options = {}) {
            if (!text || typeof text !== "string") return [];
            const { withPartPrefix = false } = options;
            if (text.length <= maxLen) return [text];

            const rawChunks = [];
            let remaining = text;
            const effectiveMaxLen = withPartPrefix ? Math.max(500, maxLen - 35) : maxLen;

            while (remaining.length > 0) {
              if (remaining.length <= effectiveMaxLen) {
                rawChunks.push(remaining);
                break;
              }

              let targetIdx = effectiveMaxLen;
              let splitIdx = remaining.lastIndexOf("\n\n", targetIdx);
              if (splitIdx === -1 || splitIdx < 1000) {
                splitIdx = remaining.lastIndexOf("\n", targetIdx);
              }
              if (splitIdx === -1 || splitIdx < 1000) {
                splitIdx = remaining.lastIndexOf(" ", targetIdx);
              }
              if (splitIdx === -1 || splitIdx < 500) {
                splitIdx = targetIdx;
              }

              const openAngle = remaining.lastIndexOf("<", splitIdx);
              const closeAngle = remaining.lastIndexOf(">", splitIdx);
              if (openAngle !== -1 && (closeAngle === -1 || closeAngle < openAngle)) {
                if (openAngle > 0) {
                  splitIdx = openAngle;
                } else {
                  const nextClose = remaining.indexOf(">", splitIdx);
                  if (nextClose !== -1) splitIdx = nextClose + 1;
                }
              }

              let chunk = remaining.slice(0, splitIdx);
              let rest = remaining.slice(splitIdx);

              const tagRegex = /<(\/)?([a-z0-9-]+)(?:\s+[^>]*)?>/gi;
              const openTagStack = [];
              let match;

              while ((match = tagRegex.exec(chunk)) !== null) {
                const isClosing = match[1] === "/";
                const tagName = match[2].toLowerCase();
                if (!SUPPORTED_TAGS.has(tagName)) continue;

                if (!isClosing) {
                  openTagStack.push({ name: tagName, fullTag: match[0] });
                } else {
                  for (let i = openTagStack.length - 1; i >= 0; i--) {
                    if (openTagStack[i].name === tagName) {
                      openTagStack.splice(i, 1);
                      break;
                    }
                  }
                }
              }

              if (openTagStack.length > 0) {
                const closingTags = openTagStack.slice().reverse().map(t => `</${t.name}>`).join("");
                chunk += closingTags;
                const openingTags = openTagStack.map(t => t.fullTag).join("");
                rest = openingTags + rest;
              }

              rawChunks.push(chunk.trim());
              remaining = rest.trim();
            }

            if (!withPartPrefix || rawChunks.length <= 1) return rawChunks;
            const total = rawChunks.length;
            return rawChunks.map((c, idx) => `📄 <i>[Phần ${idx + 1}/${total}]</i>\n${c}`);
          }

          async function postTelegramMessage(payload) {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            try {
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(15000)
              });
              const data = await res.json();
              if (!data.ok && payload.parse_mode) {
                console.warn("sendMessage non-ok, retrying without parse_mode:", data.description);
                payload.text = payload.text.replace(/<[^>]+>/g, "");
                delete payload.parse_mode;
                const retryRes = await fetch(url, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload),
                  signal: AbortSignal.timeout(15000)
                });
                return await retryRes.json();
              }
              return data;
            } catch (err) {
              console.error("Network error in postTelegramMessage:", err.message);
              return null;
            }
          }

          async function send() {
            if (!token || !chatId) return;

            const keyboard = {
              inline_keyboard: [
                [
                  { text: executeStatus === "success" ? "⚡ Xem Live Log GitHub" : "🔍 Xem Log Thất Bại", url: runUrl },
                  { text: "🌐 Mở Dev Web", url: "https://frontend-tms-core-dev.up.railway.app" }
                ]
              ]
            };

            let rawPrompt = (process.env.RAW_PROMPT || "").trim();
            const dbUrl = process.env.DATABASE_URL;

            // Nếu chưa có rawPrompt từ output, đọc trực tiếp từ DB
            if (!rawPrompt && dbUrl && taskId && taskId !== "manual" && !isNaN(Number(taskId))) {
              let cl = null;
              try {
                const { Client } = require("pg");
                cl = new Client({
                  connectionString: dbUrl,
                  ssl: dbUrl.includes("neon.tech") ? { rejectUnauthorized: false } : false
                });
                await cl.connect();
                const r = await cl.query("SELECT raw_prompt FROM telegram_tasks WHERE task_id = $1 OR (task_id IS NULL AND id = $1)", [parseInt(taskId, 10)]);
                if (r.rows.length > 0 && r.rows[0].raw_prompt) {
                  rawPrompt = r.rows[0].raw_prompt.trim();
                }
              } catch (_) {
              } finally {
                if (cl) {
                  try {
                    await cl.end();
                  } catch (_) {}
                }
              }
            }

            const promptLine = rawPrompt
              ? `📝 <b>Yêu cầu:</b> <i>"${escapeHtml(rawPrompt.length > 250 ? rawPrompt.slice(0, 247) + "..." : rawPrompt)}"</i>\n`
              : "";

            let titleHeader = "";
            let statusSubtext = "";

            if (isDone) {
              if (isLeaderMode) {
                titleHeader = `📋 <b>[TASK #${escapeHtml(taskId)}] ĐÃ LẬP KẾ HOẠCH (TODO_CREATED)</b>`;
                statusSubtext = `📋 <i>Đã phân tích yêu cầu & lập checklist TODO.md sẵn sàng triển khai.</i>\n\n`;
              } else {
                titleHeader = `✅ <b>[TASK #${escapeHtml(taskId)}] HOÀN THÀNH (DONE)</b>`;
                statusSubtext = `✅ <i>Hoàn tất kiểm định & nghiệm thu kỹ thuật.</i>\n\n`;
              }
            } else {
              titleHeader = `❌ <b>[TASK #${escapeHtml(taskId)}] THẤT BẠI (FAIL)</b>`;
              statusSubtext = `⚠️ <b>Lỗi chính:</b> <code>${escapeHtml(detailedError.slice(0, 300))}</code>\n\n`;
            }

            // 1. Kiểm tra ảnh bằng chứng nghiệm thu trong artifact
            let evidencePath = null;
            const exts = [".png", ".jpg", ".jpeg", ".webp"];
            for (const ext of exts) {
              const p = `/tmp/task_summary/evidence${ext}`;
              if (fs.existsSync(p)) {
                evidencePath = p;
                break;
              }
            }

            let photoSent = false;
            if (isDone && evidencePath && fs.existsSync(evidencePath)) {
              console.log(`📸 Phát hiện ảnh bằng chứng nghiệm thu: ${evidencePath}. Đang gửi qua Telegram sendPhoto...`);
              try {
                const fileBuffer = fs.readFileSync(evidencePath);
                const blob = new Blob([fileBuffer]);
                const formData = new FormData();
                formData.append("chat_id", String(chatId));
                formData.append("photo", blob, path.basename(evidencePath));

                const photoCaption = `${titleHeader}\n\n` +
                  `👤 <b>Người yêu cầu:</b> @${escapeHtml(sender)}\n` +
                  promptLine +
                  `▫️ <b>Commit:</b> <code>${escapeHtml(commitHash)}</code> (Branch dev)\n` +
                  `▫️ <b>Bằng chứng:</b> <code>${escapeHtml(path.basename(evidencePath))}</code>\n` +
                  (isLeaderMode ? `📋 <i>Đã tổng hợp kế hoạch TODO.md.</i>\n\n` : `✅ <i>Nghiệm thu thành công và đối soát bằng chứng giao diện.</i>\n\n`) +
                  `🔗 <a href="${runUrl}">Xem chi tiết Live Log Run #${escapeHtml(runId)}</a>`;

                formData.append("caption", photoCaption);
                formData.append("parse_mode", "HTML");
                formData.append("reply_markup", JSON.stringify(keyboard));

                const photoRes = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                  method: "POST",
                  body: formData,
                  signal: AbortSignal.timeout(20000)
                });
                const photoData = await photoRes.json();
                if (photoData.ok) {
                  console.log("✅ Đã gửi ảnh bằng chứng nghiệm thu thành công lên Telegram!");
                  photoSent = true;
                } else {
                  console.warn("sendPhoto non-ok:", photoData.description);
                }
              } catch (pErr) {
                console.warn("Lỗi khi gửi sendPhoto:", pErr.message);
              }
            }

            // Nếu không gửi ảnh (hoặc task FAIL), gửi DUY NHẤT 1 Thẻ tóm tắt hoàn chỉnh (DONE hoặc FAIL)
            if (!photoSent) {
              const summaryCard = `${titleHeader}\n\n` +
                `👤 <b>Người yêu cầu:</b> @${escapeHtml(sender)}\n` +
                promptLine +
                `▫️ <b>Commit:</b> <code>${escapeHtml(commitHash)}</code> (Branch dev)\n` +
                statusSubtext +
                `🔗 <a href="${runUrl}">Xem chi tiết Live Log Run #${escapeHtml(runId)}</a>`;

              await postTelegramMessage({
                chat_id: chatId,
                text: summaryCard,
                parse_mode: "HTML",
                reply_markup: keyboard
              });
            }
          }

          async function updateDatabase() {
            const dbUrl = process.env.DATABASE_URL;
            if (!dbUrl || !taskId || taskId === "manual" || isNaN(Number(taskId))) return;
            let client = null;
            try {
              const { Client } = require("pg");
              client = new Client({
                connectionString: dbUrl,
                ssl: dbUrl.includes("neon.tech") ? { rejectUnauthorized: false } : false
              });
              await client.connect();
              const newStatus = finalTaskStatus;
              const errorBase = detailedError || (agyRes !== "Hoàn tất tác vụ" ? agyRes : null) || "Tiến trình GitHub Actions thất bại";
              const errorVal = executeStatus === "success" 
                ? null 
                : `${errorBase.slice(0, 1800)}\n\n🔗 Workflow: ${runUrl}`;
              const finalResult = `${agyRes}\n\n🔗 Workflow: ${runUrl}`;
              await client.query(
                "UPDATE telegram_tasks SET status = $1, completed_at = NOW(), result = $2, error = $3 WHERE task_id = $4 OR (task_id IS NULL AND id = $4)",
                [newStatus, finalResult, errorVal, parseInt(taskId, 10)]
              );
              console.log(`✅ Đã cập nhật task #${taskId} sang trạng thái ${newStatus} trong Database.`);

              // TỰ ĐỘNG QUÉT & GIẢI PHÓNG HÀNG ĐỢI (AUTO-DRAIN QUEUE)
              // Chỉ tự động kích hoạt task PENDING đã tồn tại trên 30 giây để tránh xung đột với webhook tức thời từ N8N
              const remaining = await client.query(
                "SELECT id, task_id, sender_name, raw_prompt FROM telegram_tasks WHERE status = $1 AND task_id IS NOT NULL AND created_at < NOW() - make_interval(secs => 30) ORDER BY id ASC LIMIT 1",
                ["PENDING"]
              );
              if (remaining.rows.length > 0) {
                const nextTask = remaining.rows[0];
                const nextTaskId = String(nextTask.task_id != null ? nextTask.task_id : nextTask.id);
                console.log(`🔁 Phát hiện còn Task #${nextTaskId} ("${nextTask.raw_prompt}") đang PENDING trong Database! Đang tự động kích hoạt lượt chạy kế tiếp...`);
                const ghPat = process.env.GH_PAT_TOKEN;
                if (ghPat) {
                  const dispatchRes = await fetch("https://api.github.com/repos/lyquangthai1993/logistics-website/dispatches", {
                    method: "POST",
                    headers: {
                      "Authorization": `Bearer ${ghPat}`,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Antigravity-Queue-Drainer"
                    },
                    body: JSON.stringify({
                      event_type: "telegram-task",
                      client_payload: {
                        task_id: nextTaskId
                      }
                    }),
                    signal: AbortSignal.timeout(10000)
                  });
                  if (dispatchRes.status === 204) {
                    console.log(`🚀 Đã tự động kích hoạt GitHub Actions cho Task #${nextTaskId} thành công!`);
                  } else {
                    console.warn(`⚠️ Kích hoạt Task #${nextTaskId} trả về status: ${dispatchRes.status}`);
                  }
                }
              }
            } catch (dbErr) {
              console.warn("⚠️ Không thể cập nhật Database telegram_tasks:", dbErr.message);
            } finally {
              if (client) {
                try {
                  await client.end();
                } catch (_) {}
              }
            }
          }

          (async () => {
            try {
              await send();
            } catch (err) {
              console.error("Lỗi khi gửi báo cáo Telegram:", err.message);
            }
            try {
              await updateDatabase();
            } catch (err) {
              console.error("Lỗi khi cập nhật database:", err.message);
            }
            process.exit(0);
          })();
          '
