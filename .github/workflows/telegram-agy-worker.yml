name: Antigravity Telegram Task Worker

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Yêu cầu task từ Telegram'
        required: true
        type: string
      task_id:
        description: 'Task ID'
        required: false
        default: 'manual'
        type: string
      sender_name:
        description: 'Tên người gửi (Telegram Username)'
        required: false
        default: 'User'
        type: string
      mode:
        description: 'Chế độ thực thi'
        required: false
        default: 'leader'
        type: choice
        options:
          - leader
          - todo
          - sync

  repository_dispatch:
    types: [telegram-task]

concurrency:
  group: agy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-task:
    name: "🤖 Thực thi Task Antigravity CLI"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "1. Checkout Repositories & Submodules"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: "2. Cấu hình Danh tính Git"
        run: |
          git config --global user.name "Antigravity AI Worker"
          git config --global user.email "antigravity-bot@users.noreply.github.com"

      - name: "3. Cài đặt Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "4. Cài đặt Project Dependencies"
        run: |
          npm ci || npm install
          if [ -d "backend" ]; then (cd backend && npm ci || npm install); fi
          if [ -d "frontend" ]; then (cd frontend && npm ci || npm install); fi

      - name: "5. Cài đặt Antigravity CLI (agy)"
        run: |
          echo "⬇️ Đang cài đặt Antigravity CLI..."
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: "6. Thông báo Bắt đầu về Telegram"
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          TASK_ID: ${{ github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
          SENDER: ${{ github.event.inputs.sender_name || github.event.client_payload.sender_name || 'User' }}
          RAW_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
        run: |
          MSG="⏳ <b>[Antigravity GitHub Worker] Đang tiếp nhận Task #${TASK_ID}...</b>
          👤 <b>Người yêu cầu:</b> @${SENDER}
          📝 <b>Yêu cầu:</b> <code>${RAW_PROMPT}</code>
          🚀 <i>Worker đang khởi động CLI agy trên GitHub Actions...</i>"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALLOWED_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MSG}" || true

      - name: "7. Khởi chạy Antigravity CLI (Headless Mode)"
        env:
          AGY_SESSION_TOKEN: ${{ secrets.AGY_SESSION_TOKEN }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          RAW_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt }}
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'leader' }}
        run: |
          if [ -z "$AGY_SESSION_TOKEN" ] && [ -z "$ANTIGRAVITY_API_KEY" ]; then
            echo "❌ Lỗi: Thiếu secret AGY_SESSION_TOKEN trên GitHub Repository Secrets!"
            exit 1
          fi

          if [ -n "$AGY_SESSION_TOKEN" ]; then
            echo "🔐 Đang cấu hình Linux Secret Service & D-Bus session..."
            sudo apt-get update -qq && sudo apt-get install -y -qq dbus dbus-x11 gnome-keyring libsecret-tools

            eval $(dbus-launch --sh-syntax)
            export DBUS_SESSION_BUS_ADDRESS
            eval $(echo -n "" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null || true)

            printf "%s" "$AGY_SESSION_TOKEN" | secret-tool store --label="gemini" service gemini username antigravity

            echo "🔍 Kiểm tra Keyring đối soát:"
            secret-tool lookup service gemini username antigravity | cut -c 1-30

            echo "🚀 Đang khởi chạy agy headless mode với session keyring..."
            agy -p "$RAW_PROMPT" \
              --dangerously-skip-permissions \
              --model "Gemini 3.6 Flash (High)" \
              --output-format text > agy_output.txt 2>&1 || AGY_EXIT=$?
          else
            echo "🚀 Đang khởi chạy agy headless mode với API key..."
            export ANTIGRAVITY_API_KEY="$ANTIGRAVITY_API_KEY"
            export GEMINI_API_KEY="$ANTIGRAVITY_API_KEY"
            agy -p "$RAW_PROMPT" \
              --dangerously-skip-permissions \
              --model "Gemini 3.6 Flash (High)" \
              --output-format text > agy_output.txt 2>&1 || AGY_EXIT=$?
          fi

          cat agy_output.txt
          if [ -n "$AGY_EXIT" ] && [ "$AGY_EXIT" -ne 0 ]; then
            exit $AGY_EXIT
          fi

      - name: "8. Báo cáo Kết quả về Telegram (/telegram-task-responder)"
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          TASK_ID: ${{ github.event.inputs.task_id || github.event.client_payload.task_id || 'manual' }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          function escapeHtml(str) {
            return String(str || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          let rootDiff = "";
          let beDiff = "";
          let feDiff = "";
          try { rootDiff = execSync("git diff --stat", { encoding: "utf8" }).trim(); } catch (_) {}
          try { beDiff = execSync("git -C backend diff --stat", { encoding: "utf8" }).trim(); } catch (_) {}
          try { feDiff = execSync("git -C frontend diff --stat", { encoding: "utf8" }).trim(); } catch (_) {}

          let diffSummary = "Không có thay đổi file";
          if (rootDiff || beDiff || feDiff) {
            diffSummary = [rootDiff, beDiff, feDiff].filter(Boolean).join("\n");
          }

          let agyRes = "Hoàn tất tác vụ";
          if (fs.existsSync("agy_output.txt")) {
            const raw = fs.readFileSync("agy_output.txt", "utf8");
            const lines = raw.trim().split(/\r?\n/);
            agyRes = lines.slice(-20).join("\n") || "Hoàn tất tác vụ";
          }

          const statusBadge = process.env.JOB_STATUS === "success" ? "🟢 HOÀN THÀNH" : "🔴 THẤT BẠI";
          const taskId = process.env.TASK_ID || "manual";
          let commitHash = "unknown";
          try { commitHash = execSync("git rev-parse --short HEAD", { encoding: "utf8" }).trim(); } catch (_) {}

          const text = `${statusBadge}: <b>Task #${escapeHtml(taskId)}</b> trên GitHub Actions Worker\n\n` +
            `▫️ <b>1. Kết quả thực thi:</b>\n<pre>${escapeHtml(agyRes)}</pre>\n\n` +
            `▫️ <b>2. Thống kê Git Diff:</b>\n<pre>${escapeHtml(diffSummary)}</pre>\n\n` +
            `▫️ <b>Runner:</b> GitHub Actions (Ubuntu)\n` +
            `▫️ <b>Commit:</b> <code>${escapeHtml(commitHash)}</code>`;

          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_ALLOWED_CHAT_ID;

          async function send() {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            const payload = {
              chat_id: chatId,
              text,
              parse_mode: "HTML"
            };
            try {
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              });
              const data = await res.json();
              if (!data.ok) {
                console.warn("Telegram sendMessage failed with HTML, retrying plain text:", data.description);
                payload.text = text.replace(/<[^>]+>/g, "");
                delete payload.parse_mode;
                await fetch(url, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload)
                });
              }
            } catch (err) {
              console.error("Failed to notify Telegram:", err.message);
            }
          }
          send();
          '
